name: PostgreSQL interface contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sdn_qa
          POSTGRES_PASSWORD: local_qa
          POSTGRES_DB: sdn_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sdn_qa -d sdn_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SDN_DATABASE_URL: postgresql://sdn_qa:local_qa@127.0.0.1:5432/sdn_qa
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Data API and producer dependencies
        run: |
          python -m pip install -r requirements-online.txt -r ml/saved_models/offline-L30-H1/requirements-lock.txt 'pulp==3.3.2' 'pytest>=8,<9'
      - name: Assert all imports use this checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import ml, optimization, sdn, data.ingestion.online_api
          root = Path.cwd().resolve()
          for module in (ml, optimization, sdn, data.ingestion.online_api):
              assert Path(module.__file__).resolve().is_relative_to(root), module.__file__
          print('Tested checkout:', subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY
      - name: Module and orchestration regression tests
        run: python -m pytest ml/tests optimization/tests sdn/tests integration/tests testing/tests network/tests -q
      - name: Initialize disposable database
        run: |
          psql "$SDN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'SELECT version(), current_database()'
          psql "$SDN_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f data/schemas/schema_postgresql_dbeaver.sql \
            -f data/schemas/002_online_routing.sql \
            -f data/schemas/003_forecast_measurement_origin.sql \
            -f data/schemas/004_decision_tick_order.sql
          psql "$SDN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'SELECT version FROM public.schema_migrations ORDER BY version'
      - name: Run PostgreSQL contract tests
        run: |
          python -m unittest -v data.ingestion.test_management_api \
            data.ingestion.test_online_ingestion testing.scripts.test_postgresql_contracts
      - name: Verify SDN v1.4 fixtures
        if: ${{ !cancelled() }}
        run: python sdn/fixtures/data_v14_v10/verify_v10_fixtures.py --verify
      - name: Run SDN v1.4 PostgreSQL integration with zero skips
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromName("sdn.tests.integration_postgres_v14")
          if not suite.countTestCases():
              raise SystemExit("No SDN PostgreSQL integration tests discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped or not result.wasSuccessful():
              raise SystemExit("SDN PostgreSQL integration must pass with zero skips")
          PY
