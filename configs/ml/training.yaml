# Pilot search space; these are candidates, NOT already validated L*/H*/epsilon*.
lookback_candidates: [10, 30, 60]
horizon_candidates: [1, 3, 5, 10]
epsilon_candidates: [0.0, 0.05, 0.1, 0.2]
ma_window_candidates: [3, 5, 10, 30, 60]
random_state: 2026
n_jobs: 1
max_train_samples: 50000
rf_candidates:
  - n_estimators: 100
    max_depth: 16
    min_samples_leaf: 2
  - n_estimators: 150
    max_depth: 24
    min_samples_leaf: 4
# Baselines are frozen separately; no RF epsilon is applied to them.
baseline_epsilon: 0.0
